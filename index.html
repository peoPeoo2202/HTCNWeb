<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Box Match-3 Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <header>
            <h1>🍎 Fruit Box Match-3 🍊</h1>
            <div class="game-info">
                <div class="score-display">
                    <span>Score: <span id="score">0</span></span>
                </div>
                <div class="moves-display">
                    <span>Moves: <span id="moves">30</span></span>
                </div>
                <div class="level-display">
                    <span>Level: <span id="level">1</span></span>
                </div>
            </div>
            <div class="controls">
                <button id="new-game-btn">New Game</button>
                <button id="hint-btn">Hint</button>
            </div>
        </header>

        <main>
            <div class="game-board-container">
                <div id="game-board" class="game-board">
                    <!-- Game grid will be generated by JavaScript -->
                </div>
            </div>
            
            <div class="game-sidebar">
                <div class="target-panel">
                    <h3>Level Goals</h3>
                    <div id="targets">
                        <div class="target-item">
                            <span class="fruit-icon">🍎</span>
                            <span class="target-count">15</span>
                        </div>
                        <div class="target-item">
                            <span class="fruit-icon">🍊</span>
                            <span class="target-count">12</span>
                        </div>
                        <div class="target-item">
                            <span class="fruit-icon">🍌</span>
                            <span class="target-count">10</span>
                        </div>
                    </div>
                </div>
                
                <div class="power-ups">
                    <h3>Power-ups</h3>
                    <button class="power-up" id="bomb-power" title="Bomb - Clear 3x3 area">💣 <span>3</span></button>
                    <button class="power-up" id="rainbow-power" title="Rainbow - Remove all of one type">🌈 <span>2</span></button>
                    <button class="power-up" id="lightning-power" title="Lightning - Clear row and column">⚡ <span>2</span></button>
                </div>
            </div>
        </main>

        <div id="game-over-modal" class="modal hidden">
            <div class="modal-content">
                <h2 id="game-over-title">Game Over</h2>
                <p id="game-over-message">Better luck next time!</p>
                <div class="modal-buttons">
                    <button id="restart-btn">Play Again</button>
                    <button id="close-modal-btn">Close</button>
                </div>
            </div>
        </div>

        <div id="match-animation" class="match-animation hidden">
            <div class="match-text">GREAT MATCH!</div>
            <div class="match-score">+100</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
